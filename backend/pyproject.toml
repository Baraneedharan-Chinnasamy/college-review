[project]
name = "college-review-api"
version = "1.0.0"
description = "College Review System REST API (FastAPI + MongoDB)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "BLE", "C4", "PT", "RET"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]
